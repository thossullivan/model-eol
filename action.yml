name: 'model-eol check'
description: 'Fail CI when a pinned AI model ID is retired or retiring within a threshold, using model-eol feeds.'
branding:
  icon: 'alert-triangle'
  color: 'red'
inputs:
  command:
    description: 'Command to run: check, inventory, or schedule'
    required: false
    default: 'check'
  paths:
    description: 'Space-separated paths to scan'
    required: false
    default: '.'
  days:
    description: 'Fail when a model retires within this many days'
    required: false
    default: '90'
  via:
    description: 'Judge lifecycles by a distributor clock (e.g. azure-ai-foundry, aws-bedrock) instead of the publisher''s'
    required: false
    default: ''
  scope:
    description: 'Check scope: all tracked model IDs, or direct to leave cloud/gateway refs as inventory hints'
    required: false
    default: 'all'
  changed:
    description: 'Base ref for the PR gate: check only lines added relative to this ref (requires fetch-depth: 0)'
    required: false
    default: ''
  format:
    description: 'Alert output format when command is alert: github, markdown, or badge'
    required: false
    default: 'github'
  feeds:
    description: 'Directory of model-eol feeds (defaults to the feeds bundled with the action)'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: model-eol check
      shell: bash
      env:
        MODEL_EOL_COMMAND: ${{ inputs.command }}
        MODEL_EOL_PATHS: ${{ inputs.paths }}
        MODEL_EOL_DAYS: ${{ inputs.days }}
        MODEL_EOL_VIA: ${{ inputs.via }}
        MODEL_EOL_CHANGED: ${{ inputs.changed }}
        MODEL_EOL_SCOPE: ${{ inputs.scope }}
        MODEL_EOL_FORMAT: ${{ inputs.format }}
        MODEL_EOL_FEEDS: ${{ inputs.feeds }}
      run: |
        read -r -a PATH_ARGS <<< "$MODEL_EOL_PATHS"
        ARGS=("$MODEL_EOL_COMMAND" "${PATH_ARGS[@]}" --days "$MODEL_EOL_DAYS")
        if [ -n "$MODEL_EOL_VIA" ]; then ARGS+=(--via "$MODEL_EOL_VIA"); fi
        if [ -n "$MODEL_EOL_CHANGED" ]; then ARGS+=(--changed "$MODEL_EOL_CHANGED"); fi
        if [ -n "$MODEL_EOL_SCOPE" ]; then ARGS+=(--scope "$MODEL_EOL_SCOPE"); fi
        if [ -n "$MODEL_EOL_FORMAT" ]; then ARGS+=(--format "$MODEL_EOL_FORMAT"); fi
        if [ -n "$MODEL_EOL_FEEDS" ]; then ARGS+=(--feeds "$MODEL_EOL_FEEDS"); fi
        node "${{ github.action_path }}/check.mjs" "${ARGS[@]}"
