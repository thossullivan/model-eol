# Weekly feed refresh - regenerates feeds/ from the live provider pages and the
# AWS Bedrock and Google Vertex AI lifecycle pages, updates the README freshness
# line, and opens a PR with the semantic diff for human review. Never pushes to
# main directly.
#
# Optional secrets: OPENAI_API_KEY / ANTHROPIC_API_KEY / GEMINI_API_KEY enable
# the models endpoints so current-model entries (and policy-floor horizons)
# populate.
# Note: PRs opened with GITHUB_TOKEN do not trigger this repo's CI - add a
# fine-grained PAT as MODEL_EOL_BOT_TOKEN if feed PRs should run checks.
# Failures open or update one durable issue; the next successful check closes it.

name: feed-refresh

on:
  schedule:
    - cron: '23 5 * * 1' # Monday 05:23 UTC
  workflow_dispatch:

concurrency: feed-refresh

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Check live sources for changes
        id: check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          node refresh/refresh.mjs --check > provider-diff.md 2> provider-err.txt
          providers=$?
          node refresh/refresh.mjs --distributor aws-bedrock,vertex-ai --check > distributor-diff.md 2> distributor-err.txt
          distributors=$?
          set -e
          cat provider-err.txt distributor-err.txt >&2 || true
          if [ "$providers" -ne 0 ] && [ "$providers" -ne 3 ]; then
            echo "provider refresh failed with exit code $providers - no feed written" >&2
            exit 1
          fi
          if [ "$distributors" -ne 0 ] && [ "$distributors" -ne 3 ]; then
            echo "distributor refresh failed with exit code $distributors - no feed written" >&2
            exit 1
          fi
          if [ "$providers" -eq 3 ] || [ "$distributors" -eq 3 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "providers=$providers" >> "$GITHUB_OUTPUT"
          echo "distributors=$distributors" >> "$GITHUB_OUTPUT"

      - name: Regenerate feeds and README freshness
        if: steps.check.outputs.changed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node refresh/refresh.mjs
          node refresh/refresh.mjs --distributor aws-bedrock,vertex-ai
          node scripts/update-readme-freshness.mjs
          npm test

      - name: Open feed refresh PR
        if: steps.check.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.MODEL_EOL_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          branch="feed-refresh/${{ github.run_id }}"
          git config user.name "model-eol feed refresh"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add feeds/ README.md
          git commit -m "Refresh feeds from live sources ($(date -u +%Y-%m-%d))"
          git push origin "$branch"
          {
            echo "Automated weekly refresh. Review the semantic diff - a broken parse reads as a nonsense diff, not silently wrong data."
            echo
            # Include only the sources that materially changed.
            if [ "${{ steps.check.outputs.providers }}" = "3" ]; then cat provider-diff.md; echo; fi
            if [ "${{ steps.check.outputs.distributors }}" = "3" ]; then cat distributor-diff.md; fi
          } > pr-body.md
          if ! pr_url=$(gh pr create --title "Feed refresh $(date -u +%Y-%m-%d)" --body-file pr-body.md --label model-eol); then
            pr_url=$(gh pr create --title "Feed refresh $(date -u +%Y-%m-%d)" --body-file pr-body.md)
          fi
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Record successful refresh check
        if: success()
        env:
          MATERIAL_CHANGES: ${{ steps.check.outputs.changed }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          {
            echo "## Feed refresh result"
            if [ "$MATERIAL_CHANGES" = "true" ]; then
              echo "Material feed changes were regenerated and validated."
              echo "Review PR: $PR_URL"
            else
              echo "All configured live sources were checked successfully; no material feed changes were found."
              echo "The committed feed-generated date is intentionally unchanged because no feed data changed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve prior feed refresh failure
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATERIAL_CHANGES: ${{ steps.check.outputs.changed }}
          PR_URL: ${{ steps.pr.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh issue list --state open --limit 100 --json number,title \
            --jq 'map(select(.title == "Feed refresh automation failed")) | .[0].number // ""')
          if [ -n "$issue" ]; then
            if [ "$MATERIAL_CHANGES" = "true" ]; then
              result="material changes were published for review at $PR_URL"
            else
              result="all sources were checked and no material changes were found"
            fi
            gh issue comment "$issue" --body "Recovered in $RUN_URL: $result."
            gh issue close "$issue" --reason completed
          fi

      - name: Report feed refresh failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Feed refresh automation failed"
          body=$(printf '%s\n\n%s\n%s\n%s\n\n%s' \
            "The feed freshness check failed. The committed feeds may now be stale." \
            "Run: $RUN_URL" \
            "Event: $RUN_EVENT" \
            "Commit: $RUN_SHA" \
            "Inspect the failed step, repair the parser or workflow, then rerun feed-refresh from main.")
          issue=$(gh issue list --state open --limit 100 --json number,title \
            --jq 'map(select(.title == "Feed refresh automation failed")) | .[0].number // ""')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          elif ! gh issue create --title "$title" --body "$body" --label model-eol; then
            gh issue create --title "$title" --body "$body"
          fi
