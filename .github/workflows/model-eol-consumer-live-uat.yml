name: model-eol consumer live UAT

on:
  workflow_dispatch:

concurrency:
  group: model-eol-consumer-live-uat
  cancel-in-progress: false

env:
  MODEL_EOL_PACKAGE: model-eol@0.4.0
  MODEL_EOL_CONFIG: model-eol-uat.json

jobs:
  plan:
    name: build trusted plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the versioned plan
        run: |
          mkdir -p "$RUNNER_TEMP/model-eol-plan" "$RUNNER_TEMP/model-eol-npx"
          MODEL_EOL_VERSION="$(npm view "$MODEL_EOL_PACKAGE" version --json | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const v=JSON.parse(s);const r=Array.isArray(v)?v.at(-1):v;if(typeof r!=="string")process.exit(1);process.stdout.write(r)})')"
          if [[ ! "$MODEL_EOL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refusing invalid resolved model-eol version: $MODEL_EOL_VERSION" >&2
            exit 1
          fi
          printf '%s\n' "$MODEL_EOL_VERSION" > "$RUNNER_TEMP/model-eol-plan/model-eol-version"
          npm exec --yes --prefix "$RUNNER_TEMP/model-eol-npx" \
            --package="model-eol@$MODEL_EOL_VERSION" -- model-eol plan . \
            --config "$MODEL_EOL_CONFIG" \
            > "$RUNNER_TEMP/model-eol-plan/model-eol-plan.json"
      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: model-eol-plan
          path: |
            ${{ runner.temp }}/model-eol-plan/model-eol-plan.json
            ${{ runner.temp }}/model-eol-plan/model-eol-version
          if-no-files-found: error

  evaluate:
    name: evaluate isolated migration
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download trusted plan
        uses: actions/download-artifact@v4
        with:
          name: model-eol-plan
          path: ${{ runner.temp }}/model-eol-plan
      - name: Apply and evaluate the migration
        run: |
          mkdir -p "$RUNNER_TEMP/model-eol-eval" "$RUNNER_TEMP/model-eol-npx"
          MODEL_EOL_VERSION="$(cat "$RUNNER_TEMP/model-eol-plan/model-eol-version")"
          if [[ ! "$MODEL_EOL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refusing invalid resolved model-eol version: $MODEL_EOL_VERSION" >&2
            exit 1
          fi
          npm exec --yes --prefix "$RUNNER_TEMP/model-eol-npx" \
            --package="model-eol@$MODEL_EOL_VERSION" -- model-eol-bot evaluate \
            --target-dir . \
            --config "$MODEL_EOL_CONFIG" \
            --plan-file "$RUNNER_TEMP/model-eol-plan/model-eol-plan.json" \
            --output-file "$RUNNER_TEMP/model-eol-eval/model-eol-eval-results.json"
      - name: Upload bounded eval results
        uses: actions/upload-artifact@v4
        with:
          name: model-eol-eval-results
          path: ${{ runner.temp }}/model-eol-eval/model-eol-eval-results.json
          if-no-files-found: error

  publish:
    name: reconcile migration work
    needs: [plan, evaluate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download trusted plan
        uses: actions/download-artifact@v4
        with:
          name: model-eol-plan
          path: ${{ runner.temp }}/model-eol-plan
      - name: Download eval results
        uses: actions/download-artifact@v4
        with:
          name: model-eol-eval-results
          path: ${{ runner.temp }}/model-eol-eval
      - name: Publish and reconcile model-eol work
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_EOL_PLAN_FILE: ${{ runner.temp }}/model-eol-plan/model-eol-plan.json
          MODEL_EOL_EVAL_RESULTS_FILE: ${{ runner.temp }}/model-eol-eval/model-eol-eval-results.json
          MODEL_EOL_TOKEN_KIND: github-token
        run: |
          mkdir -p "$RUNNER_TEMP/model-eol-npx"
          MODEL_EOL_VERSION="$(cat "$RUNNER_TEMP/model-eol-plan/model-eol-version")"
          if [[ ! "$MODEL_EOL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refusing invalid resolved model-eol version: $MODEL_EOL_VERSION" >&2
            exit 1
          fi
          npm exec --yes --prefix "$RUNNER_TEMP/model-eol-npx" \
            --package="model-eol@$MODEL_EOL_VERSION" -- model-eol-bot \
            --repo "${{ github.repository }}" \
            --target-dir . \
            --config "$MODEL_EOL_CONFIG"
